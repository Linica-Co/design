# Security scanning. Secret scanning blocks merges; every other scanner is
# report-only for now (SARIF/JSON artifacts + job summary) until the baseline
# findings are triaged. Code-scanning upload only runs on public repos because
# GitHub code scanning is not available for private repos on the Free plan.
name: Security scans
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 19 * * 0' # weekly, Monday 06:17 Australia/Sydney
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  SEMGREP_IMAGE: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
jobs:
  secrets:
    name: Secrets (gitleaks, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan commits for secrets
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # PRs scan only their own commits; pushes and the weekly run scan full history.
          # Known historical findings are baselined by fingerprint in .gitleaksignore.
          range=()
          if [ -n "${BASE_SHA:-}" ]; then range=(--log-opts="${BASE_SHA}..HEAD"); fi
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo \
            --redact --no-banner --exit-code 1 \
            --report-format sarif --report-path /repo/gitleaks.sarif "${range[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
  sast:
    name: SAST (Semgrep, report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan --metrics=off \
            --config p/default \
            --exclude graphify-out \
            --sarif --output semgrep.sarif \
            || echo "::warning::Semgrep exited non-zero; see the semgrep-sarif artifact"
      - name: Summarise
        if: always()
        shell: bash
        run: |
          python3 - "semgrep.sarif" "Semgrep" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import collections, json, sys
          path, title = sys.argv[1], sys.argv[2]
          try:
              runs = json.load(open(path)).get("runs", [])
          except (OSError, ValueError):
              print(f"### {title}\n\nNo SARIF produced."); sys.exit(0)
          results = [r for run in runs for r in run.get("results", [])]
          levels = collections.Counter(r.get("level", "warning") for r in results)
          rules = collections.Counter(r.get("ruleId", "?") for r in results)
          print(f"### {title}: {len(results)} finding(s) {dict(levels)}\n")
          for rule, n in rules.most_common(15):
              print(f"- `{rule}` x{n}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
      - name: Upload to code scanning (public repos only)
        if: always() && github.event.repository.visibility == 'public' && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
