<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5f2"><title>Linica — Clickable Design Prototype</title>
<style>
:root{--ink:#252a32;--muted:#777d87;--line:#e6e5e2;--canvas:#f7f5f2;--rose:#bd7779;--soft:#f7e9e7}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:2}.brand{display:flex;align-items:center;gap:10px;font-weight:750}.mark{width:32px;height:32px;border-radius:11px;background:var(--rose);color:white;display:grid;place-items:center}.top-actions{display:flex;align-items:center;gap:16px}.topnote{color:var(--muted);font-size:12px}.download{color:#8f5557;font-size:12px;font-weight:700;text-decoration:none}.download:hover{text-decoration:underline}.layout{max-width:1440px;margin:auto;display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 68px)}aside{background:#fbfaf8;border-right:1px solid var(--line);padding:24px 18px;display:flex;flex-direction:column;gap:18px}.eyebrow{font-size:10px;font-weight:750;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:0 0 9px}.switcher{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#eeece9;border-radius:10px}.switcher button{border:0;background:transparent;color:var(--muted);padding:9px;border-radius:7px;cursor:pointer}.switcher button.active{background:#fff;color:var(--ink);box-shadow:0 1px 5px #252a3214}.flow-title{font-size:20px;margin:0}.flow-sub{color:var(--muted);font-size:12px;margin:3px 0}.search{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit}.steps{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 300px);overflow:auto}.step{display:flex;align-items:center;gap:10px;text-align:left;width:100%;border:1px solid transparent;background:transparent;border-radius:9px;padding:7px;color:var(--ink);cursor:pointer}.step:hover{background:#f1efec}.step.active{background:#fff;border-color:#eee3e1}.thumb{width:44px;height:46px;border-radius:5px;border:1px solid var(--line);object-fit:cover}.step-name{display:block;font-weight:650;font-size:12px}.step-group{display:block;font-size:10px;color:var(--muted)}.step-number{margin-left:auto;color:#a0a2a5;font-size:10px}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:11px}main{padding:36px clamp(18px,4vw,60px) 25px}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;max-width:1020px;margin:0 auto 20px}.heading h1{font-size:25px;line-height:1.2;margin:0 0 6px}.heading p{margin:0;color:var(--muted);font-size:13px}.badge{background:white;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:10px;padding:7px 10px;white-space:nowrap}.stage{max-width:1020px;margin:auto}.preview{height:clamp(340px,64vh,680px);background:#eeecea;border:1px solid #e4e1de;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.preview img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;cursor:zoom-in}.image-count{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#252a32d9;color:white;font-size:11px;padding:5px 10px;border-radius:99px;pointer-events:none}.controls{display:flex;justify-content:space-between;align-items:center;padding:15px 2px}.controls button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:9px 13px;font-weight:650;cursor:pointer}.controls button.primary{background:var(--rose);border-color:var(--rose);color:white}.controls button:disabled{opacity:.42;cursor:not-allowed}.flowline{border-top:1px solid var(--line);padding-top:13px;display:flex;gap:7px;overflow:auto;max-width:1020px;margin:auto}.flow-chip{flex:none;border:1px solid var(--line);background:white;color:var(--muted);border-radius:99px;padding:6px 9px;font-size:10px;cursor:pointer}.flow-chip.active{background:var(--soft);border-color:#ecd2d0;color:#8f5557;font-weight:700}.arrow{color:#b4b1ad;align-self:center}dialog{border:0;padding:0;background:#1f2228;color:white;border-radius:12px;max-width:96vw;max-height:94vh}dialog::backdrop{background:#15171bd9}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:12px}.modal-head button{border:1px solid #ffffff40;background:#ffffff14;color:white;border-radius:7px;padding:6px 9px;cursor:pointer}.modal-image{display:block;max-width:94vw;max-height:calc(94vh - 45px)}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);gap:13px;padding:17px 15px 12px}.steps{flex-direction:row;max-height:none;overflow-x:auto;padding-bottom:3px}.step{width:180px;flex:none}.sidefoot{display:none}main{padding:22px 15px}.preview{height:58vh;min-height:290px}.topnote{display:none}}@media(max-width:440px){.topbar{padding:0 14px}.heading h1{font-size:21px}.badge{font-size:9px}.preview{height:53vh}.download{font-size:11px}}
</style></head><body>
<header class="topbar"><div class="brand"><span class="mark">L</span><span>linica <span style="font-weight:450;color:#85858a">/ prototype</span></span></div><div class="top-actions"><span class="topnote">Clickable walkthrough</span><a class="download" href="https://github.com/Linica-Co/design/archive/refs/heads/main.zip">Download prototype + screens ↓</a></div></header>
<div class="layout"><aside><div><p class="eyebrow">Choose a product</p><div class="switcher"><button id="bookingTab" type="button">Booking</button><button id="inventoryTab" type="button">Inventory</button></div></div><div><h2 class="flow-title" id="flowTitle"></h2><p class="flow-sub" id="flowSub"></p></div><input id="search" class="search" type="search" placeholder="Filter screens…" aria-label="Filter screens"><div><p class="eyebrow">Screens <span id="screenTotal"></span></p><nav class="steps" id="steps" aria-label="Prototype screens"></nav></div><div class="sidefoot">Download the repository ZIP to keep the prototype and its screen images together. Open prototype/index.html after extracting.</div></aside>
<main><section class="heading"><div><h1 id="screenTitle"></h1><p id="screenDescription"></p></div><span class="badge" id="productBadge"></span></section><section class="stage"><div class="preview"><img id="screenImage" alt="" title="Click to enlarge"><span class="image-count" id="imageCount"></span></div><div class="controls"><button id="previous" type="button">← Previous</button><button class="primary" id="continue" type="button">Continue flow →</button></div></section><nav class="flowline" id="flowline" aria-label="Flow progress"></nav></main></div>
<dialog id="imageDialog"><div class="modal-head"><span id="modalTitle"></span><button id="closeDialog" type="button">Close ✕</button></div><img class="modal-image" id="largeImage" alt=""></dialog>
<script>
const screens={booking:[['treatments.png','Treatments','Choose a service','Browse the treatments available to book.'],['treatment-selected.png','Treatment selected','Choose a service','Review a treatment and continue with your selection.'],['treatment-selected-5.png','Treatment options','Choose a service','Explore treatment options and details.'],['treatment-location.png','Treatment location','Choose a location','Choose where you would like your treatment.'],['treatment-location-selected.png','Location selected','Choose a location','Confirm the selected treatment location.'],['select-nurse.png','Select a nurse','Choose a practitioner','Browse practitioners available for your appointment.'],['nurse-page.png','Nurse profile','Choose a practitioner','View practitioner information and availability.'],['nurse-selected.png','Nurse selected','Choose a practitioner','Confirm your preferred practitioner.'],['nurse-page-seletced.png','Available nurses','Choose a practitioner','Review the selected practitioner state.'],['treatment-time-selected-1.png','Choose date & time','Choose a time','Select an available appointment date and time.'],['treatment-time-selected-2.png','Time options','Choose a time','Compare available appointment slots.'],['treatment-time-selected-3.png','Time selected','Choose a time','Confirm your selected appointment time.'],['review-pay.png','Review booking','Review & confirm','Check your appointment details before confirming.'],['review-pay-done.png','Booking confirmed','Review & confirm','See the completed booking confirmation.'],['booking-pre-appointment.png','Upcoming appointment','Your appointment','View appointment information before your visit.'],['signin.png','Sign in','Account','Sign in to your Linica account.'],['signup.png','Create account','Account','Create an account to continue booking.'],['current-services-name-4.png','Current services','Choose a service','Review current services in the booking flow.'],['current-services-name-6.png','Service details','Choose a service','Explore more service details.']],inventory:[['home.png','Home','Dashboard','Start at the inventory operations home screen.'],['overview.png','Overview','Dashboard','Review inventory status and key metrics.'],['overview-low-un-allocated-stock.png','Stock alerts','Dashboard','Inspect low and unallocated stock alerts.'],['inventory.png','Inventory list','Manage stock','Browse inventory and stock items.'],['details.png','Item details','Manage stock','Inspect item information and allocation details.'],['reports.png','Reports','Reports','Open inventory reporting and operational insights.'],['report-outside-temps.png','Outside temperatures','Reports','Review outside-temperature report information.'],['signin.png','Sign in','Account','Sign in to the inventory management application.'],['signup.png','Create account','Account','Create an inventory application account.']]};
const state={product:'booking',index:0,query:''},$=id=>document.getElementById(id);function asset(screen){return `../${state.product==='booking'?'booking-app':'inventory-app'}/${screen[0]}`}function visible(){return screens[state.product].map((screen,index)=>({screen,index})).filter(x=>x.screen[1].toLowerCase().includes(state.query)||x.screen[2].toLowerCase().includes(state.query))}function select(index){state.index=Math.max(0,Math.min(index,screens[state.product].length-1));render()}function render(){const list=screens[state.product],screen=list[state.index];$('bookingTab').classList.toggle('active',state.product==='booking');$('inventoryTab').classList.toggle('active',state.product==='inventory');$('flowTitle').textContent=state.product==='booking'?'Book an appointment':'Manage inventory';$('flowSub').textContent=state.product==='booking'?'Explore the customer booking journey.':'Explore the inventory operations screens.';$('productBadge').textContent=state.product==='booking'?'CUSTOMER BOOKING':'INVENTORY MANAGEMENT';$('screenTitle').textContent=screen[1];$('screenDescription').textContent=screen[3];$('screenImage').src=asset(screen);$('screenImage').alt=`${state.product}: ${screen[1]}`;$('imageCount').textContent=`${state.index+1} / ${list.length}`;$('screenTotal').textContent=`(${list.length})`;$('previous').disabled=state.index===0;$('continue').textContent=state.index===list.length-1?'Start again ↺':'Continue flow →';$('steps').replaceChildren();visible().forEach(x=>{const b=document.createElement('button');b.type='button';b.className='step'+(x.index===state.index?' active':'');const img=document.createElement('img');img.className='thumb';img.src=asset(x.screen);img.alt='';const meta=document.createElement('span'),name=document.createElement('span'),group=document.createElement('span'),num=document.createElement('span');name.className='step-name';name.textContent=x.screen[1];group.className='step-group';group.textContent=x.screen[2];meta.append(name,group);num.className='step-number';num.textContent=String(x.index+1).padStart(2,'0');b.append(img,meta,num);b.onclick=()=>select(x.index);$('steps').append(b)});$('flowline').replaceChildren();let last='';list.forEach((s,i)=>{if(i&&s[2]!==last){const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='›';$('flowline').append(arrow)}const chip=document.createElement('button');chip.type='button';chip.className='flow-chip'+(i===state.index?' active':'');chip.textContent=s[2];chip.title=`Open ${s[1]}`;chip.onclick=()=>select(i);$('flowline').append(chip);last=s[2]})}function setProduct(product){state.product=product;state.index=0;state.query='';$('search').value='';render()}$('bookingTab').onclick=()=>setProduct('booking');$('inventoryTab').onclick=()=>setProduct('inventory');$('search').oninput=e=>{state.query=e.target.value.trim().toLowerCase();render()};$('previous').onclick=()=>select(state.index-1);$('continue').onclick=()=>select(state.index===screens[state.product].length-1?0:state.index+1);document.addEventListener('keydown',e=>{if($('imageDialog').open){if(e.key==='Escape')$('imageDialog').close();return}if(e.key==='ArrowRight')select(state.index+1);if(e.key==='ArrowLeft')select(state.index-1)});$('screenImage').onclick=()=>{$('largeImage').src=$('screenImage').src;$('largeImage').alt=$('screenImage').alt;$('modalTitle').textContent=$('screenTitle').textContent;$('imageDialog').showModal()};$('closeDialog').onclick=()=>$('imageDialog').close();$('imageDialog').onclick=e=>{if(e.target===$('imageDialog'))$('imageDialog').close()};render();
</script></body></html>
