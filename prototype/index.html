<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linica — Clickable Design Prototype</title>
<style>
:root{--ink:#252a32;--muted:#777d87;--line:#e6e5e2;--canvas:#f7f5f2;--rose:#bd7779;--rose-soft:#f7e9e7;--teal:#518a88}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.topbar{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:11px;font-size:16px;font-weight:750}.mark{width:32px;height:32px;border-radius:11px;background:var(--rose);color:white;display:grid;place-items:center}.topnote{color:var(--muted);font-size:12px}.layout{max-width:1440px;margin:auto;display:grid;grid-template-columns:310px minmax(0,1fr);min-height:calc(100vh - 68px)}aside{background:#fbfaf8;border-right:1px solid var(--line);padding:27px 19px;display:flex;flex-direction:column;gap:23px}.eyebrow{font-size:10px;font-weight:750;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 10px}.switcher{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#eeece9;border-radius:11px}.switcher button{border:0;background:transparent;color:var(--muted);padding:9px;border-radius:8px;font-weight:650}.switcher button.active{background:white;color:var(--ink);box-shadow:0 1px 5px #252a3214}.flow-title{font-size:20px;margin:0}.flow-sub{color:var(--muted);font-size:12px;margin:3px 0}.search{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px}.steps{display:flex;flex-direction:column;gap:5px;max-height:calc(100vh - 320px);overflow:auto}.step{display:flex;align-items:center;gap:11px;text-align:left;width:100%;border:1px solid transparent;background:transparent;border-radius:10px;padding:8px;color:var(--ink);cursor:pointer}.step.active{background:white;border-color:#eee3e1}.thumb{width:46px;height:48px;border-radius:6px;border:1px solid var(--line);object-fit:cover}.step-name{display:block;font-weight:650;font-size:12px}.step-group{display:block;font-size:10px;color:var(--muted)}.step-number{margin-left:auto;color:#a0a2a5;font-size:10px}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:11px}main{padding:38px clamp(20px,4vw,62px) 28px}.heading{display:flex;justify-content:space-between;max-width:1020px;margin:0 auto 25px}.heading h1{font-size:26px;margin:0 0 6px}.heading p{margin:0;color:var(--muted)}.badge{height:max-content;background:white;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:11px;padding:7px 11px}.stage{max-width:1020px;margin:auto}.preview{height:clamp(360px,65vh,690px);background:#eeecea;border:1px solid #e4e1de;border-radius:15px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.preview img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}.image-count{position:absolute;bottom:13px;background:#252a32c9;color:white;font-size:11px;padding:5px 10px;border-radius:99px}.controls{display:flex;justify-content:space-between;padding:17px 2px}.controls button{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 14px;font-weight:650}.controls button.primary{background:var(--rose);border-color:var(--rose);color:white}.controls button:disabled{opacity:.42}.flowline{border-top:1px solid var(--line);padding-top:16px;display:flex;gap:8px;overflow:auto}.flow-chip{flex:none;border:1px solid var(--line);background:white;color:var(--muted);border-radius:99px;padding:6px 10px;font-size:10px}.flow-chip.active{background:var(--rose-soft);border-color:#ecd2d0;color:#8f5557;font-weight:700}.arrow{color:#b4b1ad}dialog{border:0;padding:0;background:#1f2228;color:white;border-radius:12px}dialog::backdrop{background:#15171bd9}.modal-head{display:flex;justify-content:space-between;padding:11px 15px}.modal-head button{border:1px solid #ffffff40;background:#ffffff14;color:white;border-radius:7px}.modal-image{display:block;max-width:94vw;max-height:calc(94vh - 48px)}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);gap:14px}.steps{flex-direction:row;max-height:none;overflow-x:auto}.step{width:195px;flex:none}.sidefoot{display:none}main{padding:25px 16px}.preview{height:58vh}.topnote{display:none}}
</style></head><body><header class="topbar"><div class="brand"><span class="mark">L</span><span>linica / prototype</span></div><div class="topnote">Clickable walkthrough · design assets</div></header>
<div class="layout"><aside><div><p class="eyebrow">Choose a product</p><div class="switcher"><button id="bookingTab">Booking</button><button id="inventoryTab">Inventory</button></div></div><div><h2 class="flow-title" id="flowTitle"></h2><p class="flow-sub" id="flowSub"></p></div><input id="search" class="search" type="search" placeholder="Filter screens…"><div><p class="eyebrow">Screens <span id="screenTotal"></span></p><nav class="steps" id="steps"></nav></div><div class="sidefoot">Local prototype for the Linica design assets.</div></aside><main><section class="heading"><div><h1 id="screenTitle"></h1><p id="screenDescription"></p></div><span class="badge" id="productBadge"></span></section><section class="stage"><div class="preview"><img id="screenImage" alt="" title="Click to enlarge"><span class="image-count" id="imageCount"></span></div><div class="controls"><button id="previous">← Previous</button><button class="primary" id="continue">Continue flow →</button></div></section><nav class="flowline" id="flowline"></nav></main></div>
<dialog id="imageDialog"><div class="modal-head"><span id="modalTitle"></span><button id="closeDialog">Close ✕</button></div><img class="modal-image" id="largeImage" alt=""></dialog>
<script>
const screens={booking:[['treatments.png','Treatments','Choose a service','Browse the treatments available to book.'],['treatment-selected.png','Treatment selected','Choose a service','Review a treatment and continue with your selection.'],['treatment-selected-5.png','Treatment options','Choose a service','Explore treatment options and details.'],['treatment-location.png','Treatment location','Choose a location','Choose where you would like your treatment.'],['treatment-location-selected.png','Location selected','Choose a location','Confirm the selected treatment location.'],['select-nurse.png','Select a nurse','Choose a practitioner','Browse practitioners available for your appointment.'],['nurse-page.png','Nurse profile','Choose a practitioner','View practitioner information and availability.'],['nurse-selected.png','Nurse selected','Choose a practitioner','Confirm your preferred practitioner.'],['nurse-page-seletced.png','Available nurses','Choose a practitioner','Review the selected practitioner state.'],['treatment-time-selected-1.png','Choose date & time','Choose a time','Select an available appointment date and time.'],['treatment-time-selected-2.png','Time options','Choose a time','Compare available appointment slots.'],['treatment-time-selected-3.png','Time selected','Choose a time','Confirm your selected appointment time.'],['review-pay.png','Review booking','Review & confirm','Check your appointment details before confirming.'],['review-pay-done.png','Booking confirmed','Review & confirm','See the completed booking confirmation.'],['booking-pre-appointment.png','Upcoming appointment','Your appointment','View appointment information before your visit.'],['signin.png','Sign in','Account','Sign in to your Linica account.'],['signup.png','Create account','Account','Create an account to continue booking.'],['current-services-name-4.png','Current services','Choose a service','Review current services in the booking flow.'],['current-services-name-6.png','Service details','Choose a service','Explore more service details.']],inventory:[['home.png','Home','Dashboard','Start at the inventory operations home screen.'],['overview.png','Overview','Dashboard','Review inventory status and key metrics.'],['overview-low-un-allocated-stock.png','Stock alerts','Dashboard','Inspect low and unallocated stock alerts.'],['inventory.png','Inventory list','Manage stock','Browse inventory and stock items.'],['details.png','Item details','Manage stock','Inspect item information and allocation details.'],['reports.png','Reports','Reports','Open inventory reporting and operational insights.'],['report-outside-temps.png','Outside temperatures','Reports','Review outside-temperature report information.'],['signin.png','Sign in','Account','Sign in to the inventory management application.'],['signup.png','Create account','Account','Create an inventory application account.']]};
const state={product:'booking',index:0,query:''};const $=id=>document.getElementById(id);function dir(){return state.product==='booking'?'booking-app':'inventory-app'}function asset(s){return `../${dir()}/${s[0]}`}function visible(){return screens[state.product].map((s,i)=>({s,i})).filter(x=>x.s[1].toLower().includes(state.query)||x.s[2].toLower().includes(state.query))}function render(){const list=screens[state.product],s=list[state.index];$('bookingTab').classList.toggle('active',state.product==='booking');$('inventoryTab').classList.toggle('active',state.product==='inventory');$('flowTitle').textContent=state.product==='booking'?'Book an appointment':'Manage inventory';$('flowSub').textContent=state.product==='booking'?'Explore the customer booking journey.':'Explore the inventory operations screens.';$('productBadge').textContent=state.product==='booking'?'CUSTOMER BOOKING':'INVENTORY MANAGEMENT';$('screenTitle').textContent=s[1];$('screenDescription').textContent=s[3];$('screenImage').src=asset(s);$('screenImage').alt=s[1];$('imageCount').textContent=`${state.index+1} / ${list.length}`;$('screenTotal').textContent=`(${list.length})`;$('previous').disabled=state.index===0;$('continue').textContent=state.index===list.length-1?'Start again ↺':'Continue flow →';$('steps').innerHTML='';visible().forEach(x=>{const b=document.createElement('button');b.type='button';b.className='step'+(x.i===state.index?' active':'');b.innerHTML=`<img class="thumb" src="${asset(x.s)}" alt=""><span><span class="step-name">${x.s[1]}</span><span class="step-group">${x.s[2]}</span></span><span class="step-number">${String(x.i+1).padStart(2,'0')}</span>`;b.onclick=()=>select(x.i);$('steps').append(b)});$('flowline').innerHTML='';let last='';list.forEach((x,i)=>{if(i&&x[2]!==last){const a=document.createElement('span');a.className='arrow';a.textContent='›';$('flowline').append(a)}const c=document.createElement('button');c.className='flow-chip'+(i===state.index?' active':'');c.textContent=x[2];c.onclick=()=>select(i);$('flowline').append(c);last=x[2]})}function select(i){state.index=Math.max(0,Math.min(i,screens[state.product].length-1));render()}function setProduct(p){state.product=p;state.index=0;state.query='';$('search').value='';render()}$('bookingTab').onclick=()=>setProduct('booking');$('inventoryTab').onclick=()=>setProduct('inventory');$('search').oninput=e=>{state.query=e.target.value.trim().toLower();render()};$('previous').onclick=()=>select(state.index-1);$('continue').onclick=()=>select(state.index===screens[state.product].length-1?0:state.index+1);document.onkeydown=e=>{if(!$('imageDialog').open&&e.key==='ArrowRight')select(state.index+1);if(!$('imageDialog').open&&e.key==='ArrowLeft')select(state.index-1)};$('screenImage').onclick=()=>{$('largeImage').src=$('screenImage').src;$('modalTitle').textContent=$('screenTitle').textContent;$('imageDialog').showModal()};$('closeDialog').onclick=()=>$('imageDialog').close();render();
</script></body></html>
